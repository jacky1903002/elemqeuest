<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康軒國小數學 題庫與學習歷程平台</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (XLSX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
    }
    .badge-locked {
      filter: grayscale(100%);
      opacity: 0.4;
    }
    .badge-unlocked {
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ==================== HEADER / NAVIGATION ==================== -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
          <div class="bg-white text-indigo-700 p-2 rounded-lg font-black text-xl shadow">
            <i class="fa-solid fa-calculator"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight">康軒國小數學 題庫平台</h1>
            <p class="text-xs text-indigo-200">單元題庫與連續登入追蹤系統</p>
          </div>
        </div>

        <!-- Connection & Save Status Bar -->
        <div class="hidden md:flex items-center space-x-4 text-xs bg-indigo-800/60 px-3 py-1.5 rounded-full border border-indigo-500/30">
          <div class="flex items-center space-x-1.5" id="connection-status">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400" id="status-dot"></span>
            <span id="status-text">系統載入中...</span>
          </div>
          <span class="text-indigo-400">|</span>
          <div class="flex items-center space-x-1 text-indigo-200">
            <i class="fa-regular fa-clock"></i>
            <span>上次儲存: <span id="last-saved-time">尚未紀錄</span></span>
          </div>
        </div>

        <!-- User Controls / Auth Buttons -->
        <div class="flex items-center space-x-3" id="auth-header-section">
          <div id="user-profile-display" class="hidden flex items-center space-x-3">
            <span class="text-sm font-medium bg-indigo-600 px-3 py-1 rounded-full border border-indigo-400" id="header-username">使用者</span>
            <button onclick="window.handleLogout()" class="text-xs bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg transition shadow">
              <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
            </button>
          </div>
          <button id="btn-show-login" onclick="window.openAuthModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg transition shadow">
            <i class="fa-solid fa-user mr-1"></i>登入 / 註冊
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs & Global Actions -->
  <nav class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center py-2 space-y-2 md:space-y-0">
      <!-- Tabs -->
      <div class="flex space-x-1 sm:space-x-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0" id="navigation-tabs">
        <button onclick="window.switchTab('fiveup')" id="tab-fiveup" class="tab-btn text-indigo-600 border-indigo-600 font-bold px-4 py-2 border-b-2 text-sm flex items-center space-x-2 whitespace-nowrap">
          <i class="fa-solid fa-book-open"></i><span>小五上學期題庫</span>
        </button>
        <button onclick="window.switchTab('sixup')" id="tab-sixup" class="tab-btn text-slate-500 hover:text-indigo-600 border-transparent font-medium px-4 py-2 border-b-2 text-sm flex items-center space-x-2 whitespace-nowrap">
          <i class="fa-solid fa-graduation-cap"></i><span>小六上學期題庫</span>
        </button>
        <button onclick="window.switchTab('badges')" id="tab-badges" class="tab-btn text-slate-500 hover:text-indigo-600 border-transparent font-medium px-4 py-2 border-b-2 text-sm flex items-center space-x-2 whitespace-nowrap">
          <i class="fa-solid fa-award"></i><span>登入成就徽章牆</span>
        </button>
      </div>

      <!-- Export / Import & Screen Capture Actions -->
      <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
        <!-- Excel Import/Export -->
        <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-md border border-slate-300 font-medium transition flex items-center space-x-1" title="匯入 Excel">
          <i class="fa-solid fa-file-import text-emerald-600"></i><span>匯入 Excel</span>
          <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="window.importExcelData(event)">
        </label>
        <button onclick="window.exportExcelData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-md border border-slate-300 font-medium transition flex items-center space-x-1" title="匯出 Excel">
          <i class="fa-solid fa-file-excel text-emerald-600"></i><span>匯出 Excel</span>
        </button>

        <!-- Dynamic Page High-Res Capture -->
        <div class="border-l border-slate-300 h-4 mx-1"></div>
        <button onclick="window.exportPageAsImage()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1.5 rounded-md border border-indigo-200 font-medium transition flex items-center space-x-1" title="匯出高畫質 PNG">
          <i class="fa-solid fa-file-image"></i><span>高畫質 PNG</span>
        </button>
        <button onclick="window.exportPageAsPDF()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs px-2.5 py-1.5 rounded-md border border-rose-200 font-medium transition flex items-center space-x-1" title="匯出高畫質 PDF">
          <i class="fa-solid fa-file-pdf"></i><span>PDF 下載</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="capture-area">
    
    <!-- PAGE 1: FIVEUP (小五上學期題庫) -->
    <section id="page-fiveup" class="tab-content block space-y-6">
      <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-black">Grade 5</span>
            康軒國小數學 - 小五上學期題庫
          </h2>
          <p class="text-sm text-slate-500 mt-1">選取單元檢視題目，可自由展開解答與計算步驟。</p>
        </div>
        <!-- Unit Select -->
        <div class="flex items-center space-x-2 w-full sm:w-auto">
          <label for="fiveup-unit-select" class="text-sm font-semibold text-slate-700 whitespace-nowrap">選擇單元：</label>
          <select id="fiveup-unit-select" onchange="window.renderQuiz('fiveup')" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:w-64 p-2.5 font-medium shadow-sm">
            <option value="ALL">全部單元 (All Units)</option>
          </select>
        </div>
      </div>

      <!-- Quiz Questions Container -->
      <div id="fiveup-quiz-container" class="space-y-4"></div>
    </section>

    <!-- PAGE 2: SIXUP (小六上學期題庫) -->
    <section id="page-sixup" class="tab-content hidden space-y-6">
      <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-1 rounded-full font-black">Grade 6</span>
            康軒國小數學 - 小六上學期題庫
          </h2>
          <p class="text-sm text-slate-500 mt-1">小六高階數學題目複習與計算方式說明。</p>
        </div>
        <!-- Unit Select -->
        <div class="flex items-center space-x-2 w-full sm:w-auto">
          <label for="sixup-unit-select" class="text-sm font-semibold text-slate-700 whitespace-nowrap">選擇單元：</label>
          <select id="sixup-unit-select" onchange="window.renderQuiz('sixup')" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full sm:w-64 p-2.5 font-medium shadow-sm">
            <option value="ALL">全部單元 (All Units)</option>
          </select>
        </div>
      </div>

      <!-- Quiz Questions Container -->
      <div id="sixup-quiz-container" class="space-y-4"></div>
    </section>

    <!-- PAGE 3: LOGIN DAYS BADGES WALL (1 ~ 1000 Days) -->
    <section id="page-badges" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center flex-wrap gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-800">登入成就與榮譽徽章牆</h2>
          <p class="text-sm text-slate-500 mt-1">持續登入系統累積天數，解鎖屬於您的專屬勳章！</p>
        </div>
        <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-xl flex items-center space-x-3">
          <i class="fa-solid fa-fire text-amber-500 text-2xl"></i>
          <div>
            <p class="text-[11px] text-amber-700 font-bold uppercase">目前累積登入</p>
            <p class="text-lg font-black text-amber-900"><span id="badge-current-days">1</span> 天</p>
          </div>
        </div>
      </div>

      <!-- Section: Login Streak Badges (1~1000 days) -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="text-base font-bold text-slate-800 flex items-center border-b pb-3">
          <i class="fa-solid fa-calendar-days text-amber-500 mr-2 text-xl"></i>
          累積登入天數徽章 (1 ~ 1000 天)
        </h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4" id="login-badges-grid"></div>
      </div>
    </section>

  </main>

  <!-- ==================== AUTH MODAL ==================== -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative overflow-hidden">
      <!-- Close Button -->
      <button onclick="window.closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Auth Switcher Header -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tab-login" onclick="window.switchAuthTab('login')" class="flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600">帳號登入</button>
        <button id="tab-register" onclick="window.switchAuthTab('register')" class="flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600">註冊新帳號</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="window.handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">電子郵件 (Email)</label>
          <input type="email" id="login-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="student@example.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">密碼</label>
          <input type="password" id="login-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md transition text-sm">
          登入系統
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" onsubmit="window.handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">學生暱稱 (Nickname)</label>
          <input type="text" id="reg-nickname" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如：王小明">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">電子郵件 (Email)</label>
          <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="student@example.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">設定密碼 (至少6位)</label>
          <input type="password" id="reg-password" minlength="6" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow-md transition text-sm">
          立即註冊 (免審核)
        </button>
      </form>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut, 
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      get, 
      onValue 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Global State Container
    window.appState = {
      currentUser: null,
      userData: {
        nickname: '訪客',
        loginDays: 1,
        lastLoginDate: null,
        lastSaved: null
      },
      fiveupQuestions: [],
      sixupQuestions: [],
      currentTab: 'fiveup'
    };

    // Firebase References
    let auth = null;
    let db = null;

    // Default Fallback Datasets (Question, Answer, Explanation)
    const defaultFiveUp = [
      { id: "5U-01", unit: "第一單元 倍數與因數", question: "請問 24 的最大因數與最小倍數相加是多少？", answer: "48", explanation: "24 的最大因數是 24，最小倍數也是 24。計算方式：24 + 24 = 48。" },
      { id: "5U-02", unit: "第一單元 倍數與因數", question: "寫出 18 的所有因數。", answer: "1, 2, 3, 6, 9, 18", explanation: "18 的因數為能整除 18 的正整數：1×18, 2×9, 3×6。" },
      { id: "5U-03", unit: "第二單元 多邊形與內角和", question: "正六邊形的每一個內角是多少度？內角和是多少度？", answer: "內角 120°，內角和 720°", explanation: "內角和公式：(6 - 2) × 180° = 720°。每一個內角 = 720° ÷ 6 = 120°。" },
      { id: "5U-04", unit: "第三單元 異分母分數加減", question: "計算 1/2 + 1/3 的結果。", answer: "5/6", explanation: "先找分母 2 和 3 的最小公倍數 6 通分：3/6 + 2/6 = 5/6。" }
    ];

    const defaultSixUp = [
      { id: "6U-01", unit: "第一單元 質數與合數", question: "請列出 30 以內大於 10 的所有質數。", answer: "11, 13, 17, 19, 23, 29", explanation: "質數是指除了 1 和自己本身以外沒有其他因數的整數。" },
      { id: "6U-02", unit: "第二單元 圓周長與圓面積", question: "半徑為 5 公分的圓，其圓周長與圓面積分別是多少？(圓周率以 3.14 計算)", answer: "圓周長 31.4 公分，圓面積 78.5 平方公分", explanation: "圓周長 = 直徑 × 3.14 = (5 × 2) × 3.14 = 31.4 公分；圓面積 = 半徑 × 半徑 × 3.14 = 5 × 5 × 3.14 = 78.5 平方公分。" },
      { id: "6U-03", unit: "第三單元 速度與距離", question: "汽車 3 小時行駛了 210 公里，平均時速是多少公里？", answer: "時速 70 公里/小時", explanation: "速度 = 距離 ÷ 時間。計算方式：210 ÷ 3 = 70 (公里/小時)。" }
    ];

    // Standardize Question Objects for Direct Q&A
    function standardizeQuestions(rawData, defaultPrefix) {
      if (!rawData) return [];
      let list = [];
      try {
        if (Array.isArray(rawData)) {
          list = rawData;
        } else if (typeof rawData === 'object') {
          Object.keys(rawData).forEach(unitKey => {
            const val = rawData[unitKey];
            if (Array.isArray(val)) {
              val.forEach(q => list.push({ ...q, unit: q.unit || unitKey }));
            } else if (val && typeof val === 'object' && Array.isArray(val.questions)) {
              val.questions.forEach(q => list.push({ ...q, unit: q.unit || unitKey }));
            }
          });
        }
      } catch (err) {
        console.warn("JSON parse warning:", err);
      }

      return list.map((item, idx) => {
        const u = item.unit || item.category || item.title || "一般單元";
        const qText = item.question || item.title || item.stem || item.content || `題目 #${idx + 1}`;
        
        let ansText = item.answer;
        if (typeof item.answer === 'number' && item.options) {
          ansText = item.options[item.answer] || item.answer;
        }
        if (ansText === undefined || ansText === null) {
          ansText = "請參考解答詳細說明。";
        }

        return {
          id: item.id || `${defaultPrefix}-${idx + 1}`,
          unit: u,
          question: qText,
          answer: String(ansText),
          explanation: item.explanation || item.analysis || item.calculation || item.detail || "依據題意按步驟計算即可獲得答案。"
        };
      });
    }

    // Load Local JSON with Fallback
    async function loadQuestionsData() {
      try {
        const res5 = await fetch('./fiveup.json');
        if (res5.ok) {
          const json5 = await res5.json();
          const parsed = standardizeQuestions(json5, '5U');
          window.appState.fiveupQuestions = parsed.length > 0 ? parsed : defaultFiveUp;
        } else { throw new Error(); }
      } catch (e) {
        window.appState.fiveupQuestions = defaultFiveUp;
      }

      try {
        const res6 = await fetch('./sixup.json');
        if (res6.ok) {
          const json6 = await res6.json();
          const parsed = standardizeQuestions(json6, '6U');
          window.appState.sixupQuestions = parsed.length > 0 ? parsed : defaultSixUp;
        } else { throw new Error(); }
      } catch (e) {
        window.appState.sixupQuestions = defaultSixUp;
      }
    }

    // Populate Dynamic Dropdowns
    window.populateUnitDropdowns = function() {
      const fiveupSelect = document.getElementById('fiveup-unit-select');
      if (fiveupSelect) {
        const fiveupUnits = [...new Set(window.appState.fiveupQuestions.map(q => q.unit))];
        fiveupSelect.innerHTML = '<option value="ALL">全部單元 (All Units)</option>';
        fiveupUnits.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u;
          opt.textContent = u;
          fiveupSelect.appendChild(opt);
        });
      }

      const sixupSelect = document.getElementById('sixup-unit-select');
      if (sixupSelect) {
        const sixupUnits = [...new Set(window.appState.sixupQuestions.map(q => q.unit))];
        sixupSelect.innerHTML = '<option value="ALL">全部單元 (All Units)</option>';
        sixupUnits.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u;
          opt.textContent = u;
          sixupSelect.appendChild(opt);
        });
      }
    };

    // Render Question Cards
    window.renderQuiz = function(type) {
      const container = document.getElementById(`${type}-quiz-container`);
      const selectElement = document.getElementById(`${type}-unit-select`);
      if (!container || !selectElement) return;

      const selectedUnit = selectElement.value;
      const questions = type === 'fiveup' ? window.appState.fiveupQuestions : window.appState.sixupQuestions;
      const filtered = selectedUnit === 'ALL' ? questions : questions.filter(q => q.unit === selectedUnit);

      container.innerHTML = '';
      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-white rounded-xl border border-slate-200 space-y-3">
            <i class="fa-solid fa-folder-open text-4xl text-slate-300"></i>
            <p class="text-slate-500 font-medium">此單元目前尚無題目資料</p>
          </div>
        `;
        return;
      }

      filtered.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm transition hover:shadow-md";

        const detailId = `ans-detail-${q.id.replace(/[^a-zA-Z0-9]/g, '-')}`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1 rounded-md font-semibold">${q.unit}</span>
            <span class="text-xs font-bold text-slate-400">第 ${idx + 1} 題</span>
          </div>
          <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-4 leading-relaxed">${q.question}</h3>

          <!-- Action Button to Toggle Answer -->
          <div class="pt-2">
            <button onclick="window.toggleAnswerDisplay('${detailId}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-4 py-2 rounded-lg border border-indigo-200 transition flex items-center space-x-2">
              <i class="fa-solid fa-eye"></i>
              <span>顯示 / 隱藏 答案與計算過程</span>
            </button>
          </div>

          <!-- Answer & Explanation Detail Panel -->
          <div id="${detailId}" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3 animate-pop">
            <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-900">
              <span class="font-bold text-xs uppercase tracking-wider text-emerald-700 flex items-center gap-1 mb-1">
                <i class="fa-solid fa-square-check text-emerald-600"></i> 正確答案 (Answer)：
              </span>
              <p class="text-sm font-black text-emerald-800 pl-5">${q.answer}</p>
            </div>
            
            <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-lg text-indigo-900">
              <span class="font-bold text-xs uppercase tracking-wider text-indigo-700 flex items-center gap-1 mb-1">
                <i class="fa-solid fa-calculator text-indigo-600"></i> 計算方式與詳細解析 (Explanation)：
              </span>
              <p class="text-xs sm:text-sm text-indigo-950 pl-5 leading-relaxed whitespace-pre-line">${q.explanation}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    };

    // Toggle Answer Section Visibility
    window.toggleAnswerDisplay = function(elementId) {
      const target = document.getElementById(elementId);
      if (target) {
        target.classList.toggle('hidden');
      }
    };

    // Toast Messages
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-600',
        error: 'bg-rose-600',
        warning: 'bg-amber-500',
        info: 'bg-indigo-600'
      };
      toast.className = `${bgColors[type]} text-white text-xs font-bold px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 transition transform translate-y-2 opacity-0`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    // Save User Data (Local + Cloud Sync)
    async function saveUserData() {
      const timeString = new Date().toISOString();
      window.appState.userData.lastSaved = timeString;
      document.getElementById('last-saved-time').innerText = new Date(timeString).toLocaleString('zh-TW');

      localStorage.setItem('math_quiz_user_data_v2', JSON.stringify(window.appState.userData));

      if (db && window.appState.currentUser) {
        try {
          await set(ref(db, `users/${window.appState.currentUser.uid}`), window.appState.userData);
        } catch (e) {
          console.warn("Firebase sync error:", e);
        }
      }
      window.renderBadges();
    }

    // Modal Control Functions
    window.openAuthModal = () => document.getElementById('auth-modal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');
    window.switchAuthTab = (type) => {
      const tLogin = document.getElementById('tab-login');
      const tReg = document.getElementById('tab-register');
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-register');

      if (type === 'login') {
        tLogin.className = "flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600";
        tReg.className = "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
      } else {
        tReg.className = "flex-1 py-3 font-bold text-center border-b-2 border-emerald-600 text-emerald-600";
        tLogin.className = "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        fReg.classList.remove('hidden');
        fLogin.classList.add('hidden');
      }
    };

    // Auth Handlers
    window.handleRegister = async function(e) {
      e.preventDefault();
      const nickname = document.getElementById('reg-nickname').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      if (auth) {
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCredential.user, { displayName: nickname });
          window.showToast('雲端帳號註冊成功！', 'success');
          window.closeAuthModal();
          return;
        } catch (error) {
          console.warn("Firebase Auth fallback to local:", error);
        }
      }

      window.appState.userData.nickname = nickname;
      updateUserHeaderUI(nickname);
      window.showToast('已登入 (本地模式)', 'success');
      window.closeAuthModal();
      saveUserData();
    };

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (auth) {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          window.showToast('雲端登入成功！', 'success');
          window.closeAuthModal();
          return;
        } catch (error) {
          console.warn("Firebase Auth fallback:", error);
        }
      }

      const fallbackName = email.split('@')[0] || '學生';
      window.appState.userData.nickname = fallbackName;
      updateUserHeaderUI(fallbackName);
      window.showToast('已成功登入系統！', 'success');
      window.closeAuthModal();
      saveUserData();
    };

    window.handleLogout = async function() {
      if (auth && window.appState.currentUser) {
        try { await signOut(auth); } catch(e){}
      }
      window.appState.currentUser = null;
      document.getElementById('btn-show-login').classList.remove('hidden');
      document.getElementById('user-profile-display').classList.add('hidden');
      document.getElementById('user-profile-display').classList.remove('flex');
      window.showToast('已安全登出', 'info');
    };

    function updateUserHeaderUI(name) {
      document.getElementById('btn-show-login').classList.add('hidden');
      document.getElementById('user-profile-display').classList.remove('hidden');
      document.getElementById('user-profile-display').classList.add('flex');
      document.getElementById('header-username').innerText = name;
    }

    // Tab Switcher
    window.switchTab = function(tabName) {
      window.appState.currentTab = tabName;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('text-indigo-600', 'border-indigo-600', 'font-bold');
        el.classList.add('text-slate-500', 'border-transparent', 'font-medium');
      });

      document.getElementById(`page-${tabName}`).classList.remove('hidden');
      const activeTabBtn = document.getElementById(`tab-${tabName}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-slate-500', 'border-transparent', 'font-medium');
        activeTabBtn.classList.add('text-indigo-600', 'border-indigo-600', 'font-bold');
      }
    };

    // Badges Wall Rendering (Only Login Days: 1 ~ 1000 Days)
    const loginMilestones = [1, 3, 7, 14, 30, 60, 90, 120, 180, 240, 365, 500, 720, 1000];

    window.renderBadges = function() {
      const loginGrid = document.getElementById('login-badges-grid');
      const currentDaysSpan = document.getElementById('badge-current-days');
      if (!loginGrid) return;

      const userDays = window.appState.userData.loginDays || 1;
      if (currentDaysSpan) currentDaysSpan.innerText = userDays;

      loginGrid.innerHTML = loginMilestones.map(days => {
        const unlocked = userDays >= days;
        return `
          <div class="flex flex-col items-center p-4 rounded-xl border ${unlocked ? 'bg-amber-50/60 border-amber-300 badge-unlocked shadow-sm' : 'bg-slate-50 border-slate-200 badge-locked'} text-center transition">
            <div class="w-14 h-14 rounded-full ${unlocked ? 'bg-gradient-to-tr from-amber-500 to-yellow-400 text-white shadow-md' : 'bg-slate-300 text-slate-500'} flex items-center justify-center text-2xl mb-2">
              <i class="fa-solid fa-award"></i>
            </div>
            <span class="text-sm font-bold ${unlocked ? 'text-amber-950' : 'text-slate-600'}">${days} 天連續</span>
            <span class="text-[11px] font-medium ${unlocked ? 'text-amber-700' : 'text-slate-400'} mt-1">${unlocked ? '已成功解鎖' : '尚未達到'}</span>
          </div>
        `;
      }).join('');
    };

    // Excel & PNG/PDF Exports
    window.exportExcelData = () => {
      const allQuestions = [...window.appState.fiveupQuestions, ...window.appState.sixupQuestions];

      const exportRows = allQuestions.map(q => ({
        "題目ID": q.id,
        "單元名稱": q.unit,
        "題目內容": q.question,
        "答案 (Answer)": q.answer,
        "計算方式 (Explanation)": q.explanation
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "數學題庫資料");
      XLSX.writeFile(workbook, `康軒國小數學題庫匯出_${new Date().toISOString().slice(0,10)}.xlsx`);
      window.showToast('Excel 題庫已導出！', 'success');
    };

    window.importExcelData = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(firstSheet);
          window.showToast(`成功匯入 ${jsonData.length} 筆題庫資料！`, 'success');
        } catch (err) {
          window.showToast('匯入失敗，請確認檔案格式', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    };

    window.exportPageAsImage = () => {
      const target = document.getElementById('capture-area');
      window.showToast('正在導出高畫質 PNG 圖片...', 'info');

      html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
        const image = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `數學題庫頁面_${window.appState.currentTab}_${Date.now()}.png`;
        link.href = image;
        link.click();
        window.showToast('PNG 下載完成！', 'success');
      }).catch(() => window.showToast('導出 PNG 失敗', 'error'));
    };

    window.exportPageAsPDF = () => {
      const target = document.getElementById('capture-area');
      window.showToast('正在導出 PDF 文件...', 'info');

      html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`數學題庫頁面_${window.appState.currentTab}_${Date.now()}.pdf`);
        window.showToast('PDF 下載完成！', 'success');
      }).catch(() => window.showToast('導出 PDF 失敗', 'error'));
    };

    // Main App Initialization
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Calculate & Update Login Streak Days
      const cachedData = localStorage.getItem('math_quiz_user_data_v2');
      const todayStr = new Date().toDateString();
      if (cachedData) {
        try { 
          window.appState.userData = JSON.parse(cachedData);
          if (window.appState.userData.lastLoginDate !== todayStr) {
            window.appState.userData.loginDays = (window.appState.userData.loginDays || 1) + 1;
            window.appState.userData.lastLoginDate = todayStr;
          }
        } catch(e){}
      } else {
        window.appState.userData.lastLoginDate = todayStr;
      }

      // 2. Load Questions Data & Render UI
      await loadQuestionsData();
      window.populateUnitDropdowns();
      window.renderQuiz('fiveup');
      window.renderQuiz('sixup');
      window.renderBadges();
      saveUserData();

      // 3. Initialize Firebase
      try {
        const firebaseConfig = {
          apiKey: "AIzaSyD5zzHcKuBWwLA1dZjUi3zRVORSIMyQ6Og",
          authDomain: "elemqeuest.firebaseapp.com",
          projectId: "elemqeuest",
          databaseURL: "https://elemqeuest-default-rtdb.firebaseio.com",
          storageBucket: "elemqeuest.firebasestorage.app",
          messagingSenderId: "812471065830",
          appId: "1:812471065830:web:f9e8383c1dbafe5cf9ef27",
          measurementId: "G-ZGWQ4VPEZN"
        };
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
          if (user) {
            window.appState.currentUser = user;
            updateUserHeaderUI(user.displayName || user.email.split('@')[0]);
          }
        });

        const connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (snap) => {
          const dot = document.getElementById('status-dot');
          const text = document.getElementById('status-text');
          if (snap.val() === true) {
            dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
            text.innerText = "Firebase 連線正常";
          } else {
            dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
            text.innerText = "本地防護模式";
          }
        });
      } catch (err) {
        console.warn("Firebase Init notice:", err);
        const text = document.getElementById('status-text');
        if (text) text.innerText = "本地離線模式";
      }
    });
  </script>
</body>
</html>
