<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小知識題庫系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 匯入/匯出) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2canvas & jsPDF (高畫質 PNG/PDF 導出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(229, 231, 235, 1);
    }
    .badge-locked {
      filter: grayscale(1);
      opacity: 0.4;
    }
    .badge-unlocked {
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ================= 登入強制造門 (入口遮罩) ================= -->
  <div id="auth-gate" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
      <div class="bg-slate-900 px-6 py-6 text-white text-center">
        <div class="inline-block bg-blue-600 p-3 rounded-2xl text-white mb-3 shadow-lg">
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
        <h2 class="font-bold text-xl">國小知識題庫系統</h2>
        <p class="text-xs text-slate-400 mt-1">請先登入電子郵件帳號以繼續操作</p>
      </div>

      <div class="p-6">
        <!-- 登入 / 註冊 切換 Tab -->
        <div class="flex border-b border-slate-200 mb-5">
          <button id="gate-tab-login-btn" onclick="window.switchGateTab('login')" class="flex-1 py-2 text-center text-sm font-bold border-b-2 border-blue-600 text-blue-600">
            帳號登入
          </button>
          <button id="gate-tab-register-btn" onclick="window.switchGateTab('register')" class="flex-1 py-2 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600">
            註冊新帳號
          </button>
        </div>

        <!-- 登入表單 -->
        <form id="gate-login-form" onsubmit="window.handleGateLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">電子郵件 (Email)</label>
            <input type="email" id="gate-login-email" required placeholder="example@mail.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
            <input type="password" id="gate-login-password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-md">
            登入系統
          </button>
        </form>

        <!-- 註冊表單 -->
        <form id="gate-register-form" onsubmit="window.handleGateRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">暱稱 (無須審核)</label>
            <input type="text" id="gate-reg-nickname" required placeholder="請輸入您的暱稱" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">電子郵件 (Email)</label>
            <input type="email" id="gate-reg-email" required placeholder="example@mail.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">密碼 (至少 6 個字元)</label>
            <input type="password" id="gate-reg-password" required minlength="6" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-md">
            立即註冊並進入
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= 主系統畫面 (登入後解鎖) ================= -->
  <div id="main-app-container" class="opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col min-h-screen">
    
    <!-- 頂部導覽與系統狀態資訊欄 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-lg text-white">
            <i class="fa-solid fa-graduation-cap text-xl"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight">國小知識題庫系統</h1>
            <p class="text-xs text-slate-400">獨立帳號紀錄 & 實時雲端同步</p>
          </div>
        </div>

        <!-- 連線與備份時間監控 -->
        <div class="flex items-center space-x-4 text-xs">
          <div class="flex items-center space-x-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
            <span id="conn-indicator" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
            <span id="conn-text" class="text-slate-300">連線中...</span>
          </div>
          <div class="hidden sm:flex items-center space-x-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
            <i class="fa-regular fa-clock text-blue-400"></i>
            <span class="text-slate-400">上次儲存:</span>
            <span id="last-saved-time" class="text-slate-200 font-mono">未儲存</span>
          </div>
          
          <!-- 使用者資訊與登出 -->
          <div id="user-info-area" class="flex items-center space-x-2">
            <!-- 動態填入 -->
          </div>
        </div>
      </div>

      <!-- 頁面切換 Tab -->
      <div class="bg-slate-800 px-4 border-t border-slate-700">
        <div class="max-w-7xl mx-auto flex space-x-2 overflow-x-auto py-2">
          <button id="tab-btn-fiveup" onclick="window.switchPage('fiveup')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-blue-600 text-white">
            <i class="fa-solid fa-book-open mr-1.5"></i>小五上學期康軒版數學
          </button>
          <button id="tab-btn-sixup" onclick="window.switchPage('sixup')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
            <i class="fa-solid fa-book-bookmark mr-1.5"></i>小六上學期康軒版數學
          </button>
          <button id="tab-btn-badges" onclick="window.switchPage('badges')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
            <i class="fa-solid fa-award mr-1.5"></i>連續登入成就牆
          </button>
        </div>
      </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
      
      <!-- 分頁一：小五上學期康軒版數學 -->
      <section id="page-fiveup" class="page-content space-y-6">
        <div class="glass-card rounded-2xl p-5 shadow-sm">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4 mb-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900 flex items-center">
                <span class="w-3 h-6 bg-blue-600 rounded-full mr-2"></span>
                小五上學期康軒版數學題庫
              </h2>
              <p class="text-sm text-slate-500 mt-1">選取單元進行題目研讀與檢視</p>
            </div>

            <!-- 工具列：單元下拉選單與導出匯入 -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
              <select id="unit-select-fiveup" onchange="window.filterQuestions('fiveup')" class="bg-white border border-slate-300 text-slate-700 rounded-lg text-sm px-3 py-2 font-medium focus:ring-2 focus:ring-blue-500 outline-none shadow-sm flex-1 md:flex-none">
                <option value="ALL">所有單元 (載入中...)</option>
              </select>
              
              <button onclick="window.exportExcel('fiveup')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-file-excel mr-1"></i>匯出 EXCEL
              </button>
              <label class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer shadow-sm">
                <i class="fa-solid fa-file-import mr-1"></i>匯入 EXCEL
                <input type="file" accept=".xlsx, .xls" onchange="window.importExcel(event, 'fiveup')" class="hidden">
              </label>
              <button onclick="window.exportPNG('page-fiveup-content')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-image mr-1"></i>高畫質 PNG
              </button>
              <button onclick="window.exportPDF('page-fiveup-content', '小五上學期康軒版數學題庫')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-file-pdf mr-1"></i>高畫質 PDF
              </button>
            </div>
          </div>

          <!-- 題目內容渲染區 -->
          <div id="page-fiveup-content" class="space-y-4 bg-white p-4 rounded-xl border border-slate-100 min-h-[300px]">
            <div class="text-center py-12 text-slate-400">
              <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
              <p>正在載入題庫內容...</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 分頁二：小六上學期康軒版數學 -->
      <section id="page-sixup" class="page-content space-y-6 hidden">
        <div class="glass-card rounded-2xl p-5 shadow-sm">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4 mb-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900 flex items-center">
                <span class="w-3 h-6 bg-indigo-600 rounded-full mr-2"></span>
                小六上學期康軒版數學題庫
              </h2>
              <p class="text-sm text-slate-500 mt-1">選取單元進行題目研讀與檢視</p>
            </div>

            <!-- 工具列 -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
              <select id="unit-select-sixup" onchange="window.filterQuestions('sixup')" class="bg-white border border-slate-300 text-slate-700 rounded-lg text-sm px-3 py-2 font-medium focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm flex-1 md:flex-none">
                <option value="ALL">所有單元 (載入中...)</option>
              </select>
              
              <button onclick="window.exportExcel('sixup')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-file-excel mr-1"></i>匯出 EXCEL
              </button>
              <label class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer shadow-sm">
                <i class="fa-solid fa-file-import mr-1"></i>匯入 EXCEL
                <input type="file" accept=".xlsx, .xls" onchange="window.importExcel(event, 'sixup')" class="hidden">
              </label>
              <button onclick="window.exportPNG('page-sixup-content')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-image mr-1"></i>高畫質 PNG
              </button>
              <button onclick="window.exportPDF('page-sixup-content', '小六上學期康軒版數學題庫')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-file-pdf mr-1"></i>高畫質 PDF
              </button>
            </div>
          </div>

          <!-- 題目內容渲染區 -->
          <div id="page-sixup-content" class="space-y-4 bg-white p-4 rounded-xl border border-slate-100 min-h-[300px]">
            <div class="text-center py-12 text-slate-400">
              <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
              <p>正在載入題庫內容...</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 分頁三：連續登入成就牆 (1~1000天) -->
      <section id="page-badges" class="page-content space-y-6 hidden">
        <div class="glass-card rounded-2xl p-5 shadow-sm">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4 mb-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900 flex items-center">
                <span class="w-3 h-6 bg-amber-500 rounded-full mr-2"></span>
                連續登入成就勳章 (1 ~ 1000 天)
              </h2>
              <p class="text-sm text-slate-500 mt-1">目前已連續登入：<span id="current-streak-days" class="text-amber-600 font-bold text-base">1</span> 天</p>
            </div>

            <div class="flex items-center space-x-2">
              <button onclick="window.exportPNG('badges-container')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-image mr-1"></i>匯出勳章牆 PNG
              </button>
            </div>
          </div>

          <!-- 勳章展示網格 -->
          <div id="badges-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <!-- 勳章由 JavaScript 動態生成 -->
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- Firebase 9+ SDK 初始化與全域控制腳本 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 使用者提供的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyD5zzHcKuBWwLA1dZjUi3zRVORSIMyQ6Og",
      authDomain: "elemqeuest.firebaseapp.com",
      databaseURL: "https://elemqeuest-default-rtdb.firebaseio.com",
      projectId: "elemqeuest",
      storageBucket: "elemqeuest.firebasestorage.app",
      messagingSenderId: "812471065830",
      appId: "1:812471065830:web:f9e8383c1dbafe5cf9ef27",
      measurementId: "G-ZGWQ4VPEZN"
    };

    // 全域狀態
    let app, auth, db;
    let currentUser = null;
    let questionsData = {
      fiveup: [],
      sixup: []
    };
    let userStreakDays = 1;

    // 預設題庫 (Fallback)
    const defaultFiveup = [
      { id: 1, unit: "第一單元：數的十進位與計算", question: "請問 3.14159 的百分位數字是多少？", answer: "4", explanation: "十分位是1，百分位是4，千分位是1。" },
      { id: 2, unit: "第一單元：數的十進位與計算", question: "計算 1.25 × 8 = ？", answer: "10", explanation: "1.25乘以8直式計算結果恰好為10.00。" },
      { id: 3, unit: "第二單元：因數與倍數", question: "24 與 36 的最大公因數是多少？", answer: "12", explanation: "24的因數有1,2,3,4,6,8,12,24；36的因數有1,2,3,4,6,9,12,18,36。最大公因數為12。" },
      { id: 4, unit: "第三單元：多邊形與內角和", question: "正五邊形的所有內角和是多少度？", answer: "540度", explanation: "多邊形內角和公式：(n - 2) × 180° = (5 - 2) × 180° = 540°。" }
    ];

    const defaultSixup = [
      { id: 1, unit: "第一單元：質因數分解", question: "將 60 進行質因數分解的結果為何？", answer: "2^2 × 3 × 5 (或 2×2×3×5)", explanation: "60 = 2 × 30 = 2 × 2 × 15 = 2 × 2 × 3 × 5。" },
      { id: 2, unit: "第二單元：分數的除法", question: "計算 (3/4) ÷ (1/2) = ？", answer: "1 1/2 (或 3/2)", explanation: "分數相除等於乘以倒數：(3/4) × (2/1) = 6/4 = 3/2 = 1 1/2。" },
      { id: 3, unit: "第三單元：圓周長與圓面積", question: "半徑為 10 公分的圓，其面積約為多少平方公分？(圓周率以3.14計算)", answer: "314平方公分", explanation: "圓面積公式：半徑 × 半徑 × 3.14 = 10 × 10 × 3.14 = 314。" }
    ];

    // 初始化 Firebase
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getDatabase(app);

      // 連線狀態監聽
      const connectedRef = ref(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        const connInd = document.getElementById("conn-indicator");
        const connText = document.getElementById("conn-text");
        if (snap.val() === true) {
          connInd.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
          connText.innerText = "雲端已連線";
          connText.className = "text-emerald-400";
        } else {
          connInd.className = "w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse";
          connText.innerText = "離線 / 本地模式";
          connText.className = "text-yellow-400";
        }
      });

      // 監聽 User 驗證狀態 (入口控制的核心)
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const gate = document.getElementById('auth-gate');
        const mainApp = document.getElementById('main-app-container');

        if (user) {
          // 已登入：隱藏登入閘門，解鎖並顯示主系統畫面
          gate.classList.add('hidden');
          mainApp.classList.remove('opacity-0', 'pointer-events-none');
          
          renderUserInfo();
          syncUserDataFromDB(user.uid);
          loadQuestionBanks();
        } else {
          // 未登入：顯示登入閘門，隱藏主系統畫面
          gate.classList.remove('hidden');
          mainApp.classList.add('opacity-0', 'pointer-events-none');
          userStreakDays = 1;
        }
      });

    } catch (e) {
      console.warn("Firebase 初始化警告，系統啟用離線防護模式:", e);
      document.getElementById("conn-text").innerText = "本地防護模式";
    }

    // 實時備份資訊更新
    function updateLastSavedTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
      const timeEl = document.getElementById("last-saved-time");
      if (timeEl) timeEl.innerText = timeStr;
    }

    // 數據標準化
    function standardizeData(rawList, defaultList) {
      if (!Array.isArray(rawList) || rawList.length === 0) return defaultList;
      return rawList.map((item, idx) => ({
        id: item.id || (idx + 1),
        unit: item.unit || item.單元 || "綜合單元",
        question: item.question || item.題目 || "無題目內容",
        answer: item.answer || item.答案 || "無答案記錄",
        explanation: item.explanation || item.計算方式 || item.解析 || "無詳細計算步驟"
      }));
    }

    // 載入 JSON 題庫檔
    async function loadQuestionBanks() {
      // 五上
      try {
        const res5 = await fetch('./fiveup.json');
        if (res5.ok) {
          const data5 = await res5.json();
          questionsData.fiveup = standardizeData(data5, defaultFiveup);
        } else {
          questionsData.fiveup = defaultFiveup;
        }
      } catch (e) {
        questionsData.fiveup = defaultFiveup;
      }

      // 六上
      try {
        const res6 = await fetch('./sixup.json');
        if (res6.ok) {
          const data6 = await res6.json();
          questionsData.sixup = standardizeData(data6, defaultSixup);
        } else {
          questionsData.sixup = defaultSixup;
        }
      } catch (e) {
        questionsData.sixup = defaultSixup;
      }

      // 初始化 Dropdowns 與渲染
      window.populateDropdown('fiveup');
      window.populateDropdown('sixup');
      window.renderQuestions('fiveup');
      window.renderQuestions('sixup');
      window.renderBadges();
      updateLastSavedTime();
    }

    // 掛載全域操作介面
    window.switchPage = function(pageKey) {
      document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-700', 'text-slate-300');
      });

      const targetPage = document.getElementById(`page-${pageKey}`);
      const targetBtn = document.getElementById(`tab-btn-${pageKey}`);

      if (targetPage) targetPage.classList.remove('hidden');
      if (targetBtn) {
        targetBtn.classList.remove('bg-slate-700', 'text-slate-300');
        targetBtn.classList.add('bg-blue-600', 'text-white');
      }

      if (pageKey === 'badges') {
        window.renderBadges();
      }
    };

    window.populateDropdown = function(type) {
      const selectEl = document.getElementById(`unit-select-${type}`);
      if (!selectEl) return;

      const list = questionsData[type] || [];
      const units = Array.from(new Set(list.map(item => item.unit)));

      selectEl.innerHTML = `<option value="ALL">全部單元 (${list.length}題)</option>`;
      units.forEach(unit => {
        const count = list.filter(q => q.unit === unit).length;
        const opt = document.createElement('option');
        opt.value = unit;
        opt.innerText = `${unit} (${count}題)`;
        selectEl.appendChild(opt);
      });
    };

    window.filterQuestions = function(type) {
      window.renderQuestions(type);
    };

    window.renderQuestions = function(type) {
      const container = document.getElementById(`page-${type}-content`);
      const selectEl = document.getElementById(`unit-select-${type}`);
      if (!container) return;

      const selectedUnit = selectEl ? selectEl.value : "ALL";
      let list = questionsData[type] || [];

      if (selectedUnit !== "ALL") {
        list = list.filter(item => item.unit === selectedUnit);
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400">目前沒有相關題目</div>`;
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        html += `
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 hover:border-blue-300 transition shadow-sm space-y-3">
            <div class="flex justify-between items-start gap-2 border-b border-slate-200 pb-2">
              <span class="inline-block bg-blue-100 text-blue-700 font-semibold text-xs px-2.5 py-1 rounded-md">
                ${item.unit}
              </span>
              <span class="text-xs text-slate-400 font-mono">#${item.id || index + 1}</span>
            </div>
            
            <div class="font-medium text-slate-800 text-base leading-relaxed">
              ${index + 1}. ${item.question}
            </div>

            <!-- 答案與計算過程按鈕與展開區 -->
            <div class="pt-2">
              <button onclick="window.toggleAnswer('${type}-${index}')" class="text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1 outline-none">
                <i id="icon-${type}-${index}" class="fa-solid fa-chevron-down transition-transform"></i>
                <span>顯示答案與計算過程</span>
              </button>

              <div id="ans-box-${type}-${index}" class="hidden mt-3 bg-white p-3.5 rounded-lg border border-blue-100 text-sm space-y-2">
                <div class="flex items-baseline space-x-2">
                  <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded">答案</span>
                  <span class="font-bold text-slate-800">${item.answer}</span>
                </div>
                <div class="flex items-baseline space-x-2 pt-1 border-t border-slate-100">
                  <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded">計算方式</span>
                  <span class="text-slate-600">${item.explanation}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    };

    window.toggleAnswer = function(id) {
      const box = document.getElementById(`ans-box-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      if (box) {
        if (box.classList.contains('hidden')) {
          box.classList.remove('hidden');
          if (icon) icon.style.transform = 'rotate(180deg)';
        } else {
          box.classList.add('hidden');
          if (icon) icon.style.transform = 'rotate(0deg)';
        }
      }
    };

    // 勳章牆渲染 (1~1000天)
    window.renderBadges = function() {
      const container = document.getElementById("badges-container");
      const streakEl = document.getElementById("current-streak-days");
      if (streakEl) streakEl.innerText = userStreakDays;
      if (!container) return;

      const milestones = [
        1, 2, 3, 5, 7, 10, 15, 20, 30, 50, 75, 100, 
        150, 200, 250, 300, 365, 500, 700, 1000
      ];

      let html = '';
      milestones.forEach(day => {
        const isUnlocked = userStreakDays >= day;
        html += `
          <div class="flex flex-col items-center justify-center p-4 bg-white rounded-xl border ${isUnlocked ? 'border-amber-300 badge-unlocked' : 'border-slate-200 badge-locked'} text-center shadow-sm">
            <div class="w-12 h-12 rounded-full ${isUnlocked ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-400'} flex items-center justify-center text-xl mb-2">
              <i class="fa-solid ${day >= 365 ? 'fa-crown' : 'fa-medal'}"></i>
            </div>
            <span class="font-bold text-slate-800 text-sm">${day} 天</span>
            <span class="text-[10px] ${isUnlocked ? 'text-amber-600 font-semibold' : 'text-slate-400'} mt-0.5">
              ${isUnlocked ? '已解鎖成就' : '未解鎖'}
            </span>
          </div>
        `;
      });
      container.innerHTML = html;
    };

    // 登入閘門 (Auth Gate) 互動切換
    window.switchGateTab = function(tab) {
      const loginForm = document.getElementById('gate-login-form');
      const regForm = document.getElementById('gate-register-form');
      const loginBtn = document.getElementById('gate-tab-login-btn');
      const regBtn = document.getElementById('gate-tab-register-btn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "flex-1 py-2 text-center text-sm font-bold border-b-2 border-blue-600 text-blue-600";
        regBtn.className = "flex-1 py-2 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "flex-1 py-2 text-center text-sm font-bold border-b-2 border-emerald-600 text-emerald-600";
        loginBtn.className = "flex-1 py-2 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      }
    };

    window.handleGateLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('gate-login-email').value;
      const pass = document.getElementById('gate-login-password').value;

      try {
        if (!auth) throw new Error("Firebase 離線中");
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("登入失敗: " + err.message);
      }
    };

    window.handleGateRegister = async function(e) {
      e.preventDefault();
      const nickname = document.getElementById('gate-reg-nickname').value;
      const email = document.getElementById('gate-reg-email').value;
      const pass = document.getElementById('gate-reg-password').value;

      try {
        if (!auth) throw new Error("Firebase 離線中");
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: nickname });
        
        // 寫入獨立使用者專屬數據庫紀錄
        if (db) {
          const userRecordRef = ref(db, 'users/' + cred.user.uid);
          await set(userRecordRef, {
            nickname: nickname,
            email: email,
            streakDays: 1,
            lastLogin: new Date().toISOString()
          });
        }
      } catch (err) {
        alert("註冊失敗: " + err.message);
      }
    };

    window.handleLogout = async function() {
      if (auth) await signOut(auth);
      currentUser = null;
      userStreakDays = 1;
    };

    function renderUserInfo() {
      const area = document.getElementById("user-info-area");
      if (!area) return;
      if (currentUser) {
        area.innerHTML = `
          <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
            <i class="fa-solid fa-circle-user text-blue-400"></i>
            <span class="text-xs font-medium text-slate-200">${currentUser.displayName || currentUser.email}</span>
            <button onclick="window.handleLogout()" class="text-xs text-rose-400 hover:text-rose-300 ml-1 font-semibold">登出</button>
          </div>
        `;
      } else {
        area.innerHTML = ``;
      }
    }

    async function syncUserDataFromDB(uid) {
      if (!db) return;
      try {
        const userRef = ref(db, 'users/' + uid);
        onValue(userRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            userStreakDays = data.streakDays || 1;
            window.renderBadges();
            updateLastSavedTime();
          } else {
            // 若無紀錄則初始化預設專屬紀錄
            set(userRef, {
              nickname: currentUser.displayName || currentUser.email,
              email: currentUser.email,
              streakDays: 1,
              lastLogin: new Date().toISOString()
            });
          }
        });
      } catch (e) {
        console.warn("無法即時同步專屬雲端紀錄:", e);
      }
    }

    // EXCEL 匯入 / 匯出
    window.exportExcel = function(type) {
      const list = questionsData[type] || [];
      const sheetData = list.map(item => ({
        "單元": item.unit,
        "題目": item.question,
        "答案": item.answer,
        "計算方式": item.explanation
      }));

      const ws = XLSX.utils.json_to_sheet(sheetData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "題庫");
      XLSX.writeFile(wb, `康軒數學_${type === 'fiveup' ? '五上' : '六上'}_題庫.xlsx`);
      updateLastSavedTime();
    };

    window.importExcel = function(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonArr = XLSX.utils.sheet_to_json(firstSheet);

          const newList = standardizeData(jsonArr, []);
          if (newList.length > 0) {
            questionsData[type] = newList;
            window.populateDropdown(type);
            window.renderQuestions(type);
            alert(`成功匯入 ${newList.length} 筆題目！`);
            updateLastSavedTime();
          } else {
            alert("匯入失敗：檔案中沒有發現合格題目資料。");
          }
        } catch (err) {
          alert("解析 Excel 檔案失敗: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    };

    // PNG 導出
    window.exportPNG = function(elementId) {
      const target = document.getElementById(elementId);
      if (!target) return;

      html2canvas(target, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `高畫質圖檔_${new Date().getTime()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        updateLastSavedTime();
      });
    };

    // PDF 導出
    window.exportPDF = function(elementId, title) {
      const target = document.getElementById(elementId);
      if (!target) return;

      html2canvas(target, { scale: 2 }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 210;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
        pdf.save(`${title}_${new Date().getTime()}.pdf`);
        updateLastSavedTime();
      });
    };
  </script>
</body>
</html>
